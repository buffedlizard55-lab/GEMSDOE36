[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe36"
version = "0.1.0"
description = "Auditable, spatially validated fault-mapping research scaffold for DOE GEMS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/gems", "scripts/submission_writer.py"]  # vendored shared template: byte-identical, never reformatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts insert src/ on sys.path before importing project modules
"tests/test_orientation.py" = ["E402"]
"scripts/run_holdout.py" = ["B905", "B023"]  # legacy 2026-10-04 driver (superseded); closure is used within its loop iteration
"src/gemsdoe36/hypotheses.py" = ["B905"]  # legacy module
"scripts/lane36_*.py" = ["E", "W", "I", "B", "F"]  # parallel Lane36 session code (PR #12): kept byte-identical, style not enforced here
